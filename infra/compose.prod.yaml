name: aion-prod

x-backend: &backend
  build:
    context: ..
    dockerfile: backend/Dockerfile
  restart: unless-stopped
  environment: &environment
    AION_ENVIRONMENT: production
    AION_DB_HOST: postgres
    AION_DB_NAME: ${AION_DB_NAME:-aion}
    AION_DB_USER: aion_runtime
    AION_DB_PASSWORD: ${AION_DB_PASSWORD:?Set runtime password}
    AION_REDIS_URL: redis://redis:6379/0
    AION_RESULT_BACKEND: redis://redis:6379/1
    AION_PUBLIC_ORIGIN: ${AION_PUBLIC_ORIGIN:?Set HTTPS origin}
    AION_STORAGE_PATH: /data/private
    AION_STORAGE_BACKEND: ${AION_STORAGE_BACKEND:-local}
    AION_S3_ENDPOINT: ${AION_S3_ENDPOINT:-}
    AION_S3_BUCKET: ${AION_S3_BUCKET:-aion-private}
    AION_S3_REGION: ${AION_S3_REGION:-us-east-1}
    AION_S3_ACCESS_KEY: ${AION_S3_ACCESS_KEY:-}
    AION_S3_SECRET_KEY: ${AION_S3_SECRET_KEY:-}
    AION_LLM_ENABLED: ${AION_LLM_ENABLED:-false}
    AION_LLM_BASE_URL: ${AION_LLM_BASE_URL:-https://api.openai.com/v1}
    AION_LLM_MODEL: ${AION_LLM_MODEL:-}
    AION_LLM_API_KEY: ${AION_LLM_API_KEY:-}
    AION_LLM_DAILY_BUDGET_USD: ${AION_LLM_DAILY_BUDGET_USD:-1}
    AION_LLM_INPUT_USD_PER_MILLION: ${AION_LLM_INPUT_USD_PER_MILLION:-10}
    AION_LLM_OUTPUT_USD_PER_MILLION: ${AION_LLM_OUTPUT_USD_PER_MILLION:-40}
    AION_STT_ENABLED: ${AION_STT_ENABLED:-false}
    AION_STT_BASE_URL: ${AION_STT_BASE_URL:-https://api.openai.com/v1}
    AION_STT_MODEL: ${AION_STT_MODEL:-}
    AION_STT_API_KEY: ${AION_STT_API_KEY:-}
    AION_STT_GLOBAL_DAILY_SECONDS: ${AION_STT_GLOBAL_DAILY_SECONDS:-3600}
    AION_TELEGRAM_BOT_TOKEN: ${AION_TELEGRAM_BOT_TOKEN:-}
    AION_TELEGRAM_BOT_USERNAME: ${AION_TELEGRAM_BOT_USERNAME:-}
    AION_TELEGRAM_WEBHOOK_SECRET: ${AION_TELEGRAM_WEBHOOK_SECRET:-}
    AION_VAPID_PRIVATE_KEY: ${AION_VAPID_PRIVATE_KEY:-}
    AION_VAPID_PUBLIC_KEY: ${AION_VAPID_PUBLIC_KEY:-}
    AION_VAPID_SUBJECT: ${AION_VAPID_SUBJECT:-}
  volumes:
    - private-data:/data/private

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: ${AION_DB_NAME:-aion}
      POSTGRES_PASSWORD: ${POSTGRES_BOOTSTRAP_PASSWORD:?Set bootstrap password}
      AION_DB_PASSWORD: ${AION_DB_PASSWORD:?Set runtime password}
      AION_DB_MIGRATION_PASSWORD: ${AION_DB_MIGRATION_PASSWORD:?Set migration password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    <<: *backend
    restart: "no"
    environment:
      <<: *environment
      AION_DB_MIGRATION_USER: aion_migrator
      AION_DB_MIGRATION_PASSWORD: ${AION_DB_MIGRATION_PASSWORD:?Set migration password}
    command: [uv, run, --no-sync, alembic, upgrade, head]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *backend
    command: [uv, run, --no-sync, uvicorn, "aion.app:create_app", --factory, --host, 0.0.0.0, --port, "8000", --no-access-log, --proxy-headers, --forwarded-allow-ips, "*"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
  worker:
    <<: *backend
    command: [uv, run, --no-sync, celery, -A, "aion.jobs.celery_app:celery_app", worker, --loglevel, INFO, --queues, system, --concurrency, "1"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  worker-ai:
    <<: *backend
    command: [uv, run, --no-sync, celery, -A, "aion.jobs.celery_app:celery_app", worker, --loglevel, INFO, --queues, ai, --concurrency, "1"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  worker-delivery:
    <<: *backend
    command: [uv, run, --no-sync, celery, -A, "aion.jobs.celery_app:celery_app", worker, --loglevel, INFO, --queues, delivery, --concurrency, "2"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  scheduler:
    <<: *backend
    command: [uv, run, --no-sync, aion-scheduler]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      AION_DOMAIN: ${AION_DOMAIN:?Set public domain}
    ports: ["80:80", "443:443"]
    volumes: [caddy-data:/data, caddy-config:/config]
    depends_on:
      api: {condition: service_healthy}

volumes:
  postgres-data:
  redis-data:
  private-data:
  caddy-data:
  caddy-config:
