[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "aion-backend"
version = "0.1.0"
description = "AION application API and background processes"
requires-python = ">=3.13,<3.15"
dependencies = [
  "alembic>=1.17,<2",
  "argon2-cffi>=25.1,<26",
  "celery[redis]>=5.6,<6",
  "fastapi>=0.119,<1",
  "email-validator>=2.3,<3",
  "pydantic-settings>=2.11,<3",
  "psycopg[binary]>=3.2.12,<4",
  "redis>=6.4,<8",
  "sqlalchemy[asyncio]>=2.0.44,<2.1",
  "uvicorn[standard]>=0.38,<1",
  "httpx>=0.28,<1",
  "boto3>=1.40,<2",
  "pywebpush>=2.0,<3",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.18,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.13,<1",
]

[project.scripts]
aion-scheduler = "aion.jobs.scheduler:main"
aion-admin = "aion.modules.identity.cli:main"
aion-ops = "aion.operations:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aion"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires an isolated PostgreSQL database and Redis"]

[tool.mypy]
python_version = "3.13"
files = ["src/aion"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["celery", "celery.*", "boto3", "pywebpush"]
ignore_missing_imports = true
