name: Check scaffold
on: [push, pull_request]
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install project tools
        run: |
          python -m pip install uv==0.13.1
          npm install --global pnpm@11.18.0
      - name: Install dependencies
        run: |
          uv sync --locked --project backend
          pnpm --dir frontend install --frozen-lockfile
      - name: Check backend
        run: |
          uv run --locked --project backend ruff check backend/src backend/tests
          uv run --locked --project backend mypy --config-file backend/pyproject.toml backend/src/aion
          uv run --locked --project backend pytest backend/tests
      - name: Build frontend
        run: pnpm --dir frontend build
      - name: Start runtime
        run: docker compose -f infra/compose.dev.yaml up --build -d
      - name: Verify real runtime
        env:
          AION_DB_MIGRATION_PASSWORD: local_migration_password
        run: uv run --locked --project backend python infra/scripts/smoke.py --wait-seconds 120
      - name: Runtime logs
        if: failure()
        run: docker compose -f infra/compose.dev.yaml logs --no-color --tail 100
      - name: Stop runtime
        if: always()
        run: docker compose -f infra/compose.dev.yaml down
